name: MetroFlashlight
version: ${project.version}
main: ru.metro.flashlight.MetroFlashlight
api-version: '1.21'
description: Фонарик с батарейкой для сервера Метро
commands:
  flashlight:
    description: Включение/выключение фонарика и управление плагином
    usage: /flashlight <toggle|on|off|reload>
permissions:
  flashlight.use:
    description: Включать и выключать фонарик
    default: true
  flashlight.admin:
    description: Перезагрузка конфигурации
    default: op
