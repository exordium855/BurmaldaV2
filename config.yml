# Фонарик. Предмет определяется по материалу и CustomModelData (как в MythicMobs).
flashlight:
  material: STICK
  custom-model-data: 49
  # Дальность луча в блоках
  range: 8
  # Яркость точек света вдоль луча от игрока к цели (1-15).
  # Чем больше значений, тем больше точек. Последняя - там, куда упирается луч.
  light-levels: [4, 6, 7]
  # Как часто обновляется свет (в тиках, 20 тиков = 1 секунда)
  update-ticks: 3

# Включение и выключение фонарика
toggle:
  # Включён ли фонарик у игрока по умолчанию (true - светит сразу, false - надо включить)
  default-enabled: false
  # Переключать правой кнопкой мыши, когда фонарик в руке
  click: true
  # Звук щелчка при переключении
  sound: true

# Видимость света для других игроков
share:
  # true - свет фонарика видят все игроки рядом, false - только владелец
  enabled: true
  # В каком радиусе (в блоках) другие игроки видят свет
  radius: 48

# Заряд хранится в прочности предмета (MaxDurability в Mythic).
# Если у предмета прочности нет, фонарик светит бесконечно.
drain:
  # Раз в сколько секунд тратится заряд
  interval-seconds: 1
  # Сколько единиц прочности тратится за раз
  amount: 1

# Батарейка: когда заряд закончился, из инвентаря (любая рука или слот)
# берётся одна батарейка, и фонарик заряжается.
battery:
  material: GOLD_NUGGET
  custom-model-data: 50
  # Какой процент заряда возвращает одна батарейка
  restore-percent: 100

messages:
  low: "<yellow>Заряд фонарика: {percent}%"
  dead: "<red>Фонарик не светит: нужна батарейка"
  replaced: "<green>Батарейка заменена"
  on: "<green>Фонарик включён"
  off: "<gray>Фонарик выключен"
  reloaded: "<green>Конфигурация фонарика перезагружена"
  # Показывать предупреждение, когда заряд не выше этого процента
  low-threshold-percent: 20
